<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vocabulary Practice</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(70px + env(safe-area-inset-bottom));
    }

    html {
      height: -webkit-fill-available;
    }

    /* Header */
    header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .progress-info {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .btn-secondary {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-bar-container {
      height: 4px;
      background: var(--border);
      width: 100%;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Main Container */
    main {
      flex: 1;
      padding: 16px;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .view-section {
      display: none;
      flex-direction: column;
      width: 100%;
      flex: 1;
    }

    .view-section.active {
      display: flex;
    }

    /* Flashcard Styles */
    .card-container {
      perspective: 1000px;
      width: 100%;
      height: 260px;
      margin: 12px 0;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .card-container.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .card-back {
      transform: rotateY(180deg);
      border-color: var(--accent);
    }

    .card-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .audio-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(59, 130, 246, 0.15);
      border: none;
      color: var(--accent);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .word-text {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      word-break: break-word;
    }

    .word-sub {
      font-size: 13px;
      color: var(--text-muted);
    }

    .tap-hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    /* Flashcard Controls (Outside the Card) */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .btn-action {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-action:active {
      background: var(--border);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Bottom Navigation Bar */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      width: 25%;
    }

    .nav-item.active {
      color: var(--accent);
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Quiz View */
    .quiz-question {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin: 16px 0;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .option-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 16px;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--success);
      color: #6ee7b7;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--error);
      color: #fca5a5;
    }

    /* List View */
    .list-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .list-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-en {
      font-weight: 600;
      font-size: 15px;
    }

    .list-ru {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Match View */
    .match-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .match-card.selected {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.2);
    }

    .match-card.matched {
      opacity: 0.2;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="progress-info" id="progressText">Card 1 of 38</div>
    <button class="btn-secondary" id="shuffleBtn" onclick="shuffleWords()">🔀 Shuffle</button>
  </header>
  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <main>
    <!-- FLASHCARDS VIEW -->
    <section id="cardsView" class="view-section active">
      <div class="card-container" id="flashcard" onclick="flipCard()">
        <div class="card-inner">
          <div class="card-front">
            <span class="card-tag">ENGLISH</span>
            <button class="audio-btn" onclick="speakCurrent(event)">🔊</button>
            <div class="word-text" id="cardEn">baker's</div>
            <div class="word-sub">Tap card to see Russian</div>
          </div>
          <div class="card-back">
            <span class="card-tag">RUSSIAN</span>
            <div class="word-text" id="cardRu">пекарня</div>
            <div class="word-sub">Tap card to show English</div>
          </div>
        </div>
      </div>

      <div class="tap-hint">🔄 Tap card to flip</div>

      <div class="controls">
        <button class="btn-action" onclick="prevCard()">← Previous</button>
        <button class="btn-action btn-primary" onclick="nextCard()">Next →</button>
      </div>
    </section>

    <!-- QUIZ VIEW -->
    <section id="quizView" class="view-section">
      <div class="quiz-question" id="quizQuestion">baker's</div>
      <div class="options-grid" id="quizOptions"></div>
    </section>

    <!-- MATCH VIEW -->
    <section id="matchView" class="view-section">
      <div class="match-grid" id="matchGrid"></div>
    </section>

    <!-- LIST VIEW -->
    <section id="listView" class="view-section">
      <div class="list-container" id="listContainer"></div>
    </section>
  </main>

  <nav>
    <button class="nav-item active" onclick="switchView('cardsView', this)">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
      Cards
    </button>
    <button class="nav-item" onclick="switchView('quizView', this); initQuiz();">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
      Quiz
    </button>
    <button class="nav-item" onclick="switchView('matchView', this); initMatch();">
      <svg viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.4 0 2.5 1.1 2.5 2.5s-1.1 2.5-2.5 2.5H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.4 1.1-2.5 2.5-2.5s2.5 1.1 2.5 2.5V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5s-1.12-2.5-2.5-2.5z"/></svg>
      Match
    </button>
    <button class="nav-item" onclick="switchView('listView', this); renderList();">
      <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
      List
    </button>
  </nav>

  <script>
    const vocabulary = [
      { en: "baker's", ru: "пекарня" },
      { en: "bank", ru: "банк" },
      { en: "butcher's", ru: "мясная лавка" },
      { en: "charity shop", ru: "благотворительный магазин" },
      { en: "chemist's", ru: "аптека" },
      { en: "coffee shop", ru: "кофейня" },
      { en: "clothes shop", ru: "магазин одежды" },
      { en: "cosmetics store", ru: "парфюмерия, магазин косметики" },
      { en: "deli", ru: "небольшая закусочная" },
      { en: "delicatessen", ru: "деликатесы" },
      { en: "DIY store", ru: "магазин 'сделай сам'" },
      { en: "estate agent", ru: "агент по недвижимости" },
      { en: "florist's", ru: "цветочный магазин" },
      { en: "garden centre", ru: "садовый центр" },
      { en: "greengrocer's", ru: "овощной магазин" },
      { en: "hairdresser's", ru: "парикмахерская" },
      { en: "jeweller's", ru: "ювелирный магазин" },
      { en: "launderette", ru: "прачечная" },
      { en: "newsagent's", ru: "газетный киоск" },
      { en: "optician's", ru: "магазин оптики" },
      { en: "post office", ru: "почта" },
      { en: "shoe shop", ru: "обувной" },
      { en: "stationer's", ru: "магазин канцтоваров" },
      { en: "takeaway", ru: "на вынос" },
      { en: "orchid", ru: "орхидея" },
      { en: "bargain", ru: "выгодная покупка" },
      { en: "coupon", ru: "купон" },
      { en: "discount", ru: "скидка" },
      { en: "discount code", ru: "промокод" },
      { en: "receipt", ru: "чек, квитанция" },
      { en: "sale", ru: "распродажа" },
      { en: "special offer", ru: "специальное предложение" },
      { en: "price tag", ru: "ценник" },
      { en: "crafty", ru: "хитрый, коварный" },
      { en: "have/get a haircut", ru: "сделать стрижку" },
      { en: "swap", ru: "обмениваться" },
      { en: "equal", ru: "равный" },
      { en: "essentials", ru: "предметы первой необходимости" }
    ];

    let words = [...vocabulary];
    let currentIndex = 0;

    function updateCard() {
      const item = words[currentIndex];
      document.getElementById('cardEn').innerText = item.en;
      document.getElementById('cardRu').innerText = item.ru;
      document.getElementById('flashcard').classList.remove('flipped');
      
      document.getElementById('progressText').innerText = `Card ${currentIndex + 1} of ${words.length}`;
      document.getElementById('progressBar').style.width = `${((currentIndex + 1) / words.length) * 100}%`;
    }

    function flipCard() {
      document.getElementById('flashcard').classList.toggle('flipped');
    }

    function nextCard() {
      if (currentIndex < words.length - 1) {
        currentIndex++;
        updateCard();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    }

    function shuffleWords() {
      words.sort(() => Math.random() - 0.5);
      currentIndex = 0;
      updateCard();
    }

    function speakCurrent(e) {
      e.stopPropagation();
      const utterance = new SpeechSynthesisUtterance(words[currentIndex].en);
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    }

    function switchView(viewId, el) {
      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      
      document.getElementById(viewId).classList.add('active');
      el.classList.add('active');
    }

    /* Quiz Implementation */
    let quizIndex = 0;
    function initQuiz() {
      quizIndex = 0;
      showQuizQuestion();
    }

    function showQuizQuestion() {
      const current = words[quizIndex];
      document.getElementById('quizQuestion').innerText = current.en;
      
      // Select 3 random distractors
      let options = [current.ru];
      while (options.length < 4) {
        let randomRu = words[Math.floor(Math.random() * words.length)].ru;
        if (!options.includes(randomRu)) options.push(randomRu);
      }
      options.sort(() => Math.random() - 0.5);

      const grid = document.getElementById('quizOptions');
      grid.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkQuiz(btn, opt === current.ru);
        grid.appendChild(btn);
      });
    }

    function checkQuiz(btn, isCorrect) {
      const btns = document.querySelectorAll('.option-btn');
      btns.forEach(b => b.style.pointerEvents = 'none');
      
      if (isCorrect) {
        btn.classList.add('correct');
      } else {
        btn.classList.add('wrong');
      }

      setTimeout(() => {
        quizIndex = (quizIndex + 1) % words.length;
        showQuizQuestion();
      }, 1200);
    }

    /* Match Implementation */
    let selectedCards = [];
    function initMatch() {
      const grid = document.getElementById('matchGrid');
      grid.innerHTML = '';
      
      // Take 6 random pairs
      let sample = [...words].sort(() => Math.random() - 0.5).slice(0, 6);
      let cards = [];
      sample.forEach(item => {
        cards.push({ id: item.en, text: item.en, pair: item.ru });
        cards.push({ id: item.en, text: item.ru, pair: item.en });
      });
      cards.sort(() => Math.random() - 0.5);

      cards.forEach(card => {
        const div = document.createElement('div');
        div.className = 'match-card';
        div.innerText = card.text;
        div.onclick = () => handleMatchSelect(div, card);
        grid.appendChild(div);
      });
    }

    function handleMatchSelect(el, card) {
      if (el.classList.contains('selected') || el.classList.contains('matched')) return;

      el.classList.add('selected');
      selectedCards.push({ el, card });

      if (selectedCards.length === 2) {
        const [first, second] = selectedCards;
        if (first.card.id === second.card.id) {
          first.el.classList.add('matched');
          second.el.classList.add('matched');
          selectedCards = [];
        } else {
          setTimeout(() => {
            first.el.classList.remove('selected');
            second.el.classList.remove('selected');
            selectedCards = [];
          }, 800);
        }
      }
    }

    /* List View */
    function renderList() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';
      vocabulary.forEach(item => {
        const row = document.createElement('div');
        row.className = 'list-item';
        row.innerHTML = `<span class="list-en">${item.en}</span><span class="list-ru">${item.ru}</span>`;
        container.appendChild(row);
      });
    }

    // Initialize first card on load
    updateCard();
  </script>
</body>
</html>
